<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your week · Hung's report</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:#1f2421; display:flex; flex-direction:column;
       background:#1aa263; transition:background .5s;}  /* green=hit, turns red via JS */

  .top{color:#fff; flex-shrink:0; display:flex; flex-direction:column; align-items:center;
       justify-content:center; text-align:center; padding:30px 22px; min-height:120px;
       transition:all .28s ease; overflow:hidden;}
  /* collapsed (scrolled) — single line: avatar left, goal right */
  body[scrolled] .top{flex-direction:row; justify-content:space-between; align-items:center;
       min-height:74px; padding:10px 24px;}
  body[scrolled] .avatar{width:44px;height:44px;font-size:11px;border-width:2px;}
  body[scrolled] .tagline{display:none;}
  body[scrolled] .metric .n{font-size:26px;letter-spacing:-1px;}
  body[scrolled] .metric .goal{font-size:12px;}
  .avatar{transition:all .28s ease;}
  .avatar{width:120px; height:120px; border-radius:50%; object-fit:cover;
        border:3px solid rgba(255,255,255,.55); box-shadow:0 6px 20px rgba(0,0,0,.18);}
  .tagline{margin-top:14px; font-size:14px; font-weight:600; opacity:.8; letter-spacing:.2px;}
  .metric{margin-top:18px; line-height:1;}
  .metric .n{font-size:92px; font-weight:800; letter-spacing:-3px;}
  .metric .goal{font-size:32px; font-weight:700; opacity:.95; letter-spacing:-.5px;}

  .bottom{background:#fff; flex:1; padding:16px 20px 22px; border-top-left-radius:24px;
        border-top-right-radius:24px; box-shadow:0 -6px 24px rgba(0,0,0,.08);
        overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;}
  .bars{display:flex; align-items:flex-end; gap:5px; height:120px; position:relative;
        padding-top:16px;}
  .bar{flex:1; min-width:0; border-radius:6px 6px 2px 2px; position:relative;}
  .bar.ok{background:#22c55e;} .bar.no{background:#e0553f;}
  .goal-line{position:absolute; left:0; right:0; border-top:2px dashed #16a34a; opacity:.75;}
  .tooltip{position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
        background:#1f2421; color:#fff; font-size:13px; font-weight:700; padding:3px 8px;
        border-radius:6px; white-space:nowrap; pointer-events:none; opacity:0;
        transition:opacity .12s; z-index:5;}
  .bar.tapped .tooltip{opacity:1;}
  .bar.tapped{outline:2px solid #1f2421; outline-offset:2px;}
  .xlabels{display:flex; gap:5px; margin-top:9px;}
  .xlabels span{flex:1; text-align:center; font-size:8.5px; color:#a5aba5;}
  .charttitle{margin-top:10px; font-size:10px; letter-spacing:1.3px; text-transform:uppercase;
        color:#8a8f8a; font-weight:800; text-align:center;}
  .readout{min-height:24px; margin:8px 0 0; font-size:14px; font-weight:700; color:#222;
        text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .evals{margin-top:16px; border-top:1px solid #e6e8e6; padding-top:12px;}
  .evals-title{font-size:10px; letter-spacing:1.3px; text-transform:uppercase;
        color:#8a8f8a; font-weight:800; margin-bottom:8px; text-align:center;}
  .eval-table{width:100%; border-collapse:collapse;}
  .eval-table th{font-size:9.5px; text-transform:uppercase; letter-spacing:.6px; color:#a5aba5;
        font-weight:700; text-align:left; padding:0 6px 8px;}
  .eval-table th.r{text-align:right;}
  .eval-table td{font-size:13px; color:#333; border-top:1px solid #eef1ee; padding:9px 6px;}
  .eval-table td .date{font-weight:700; color:#111;}
  .eval-table td.r{text-align:right;}
  .glyph{font-weight:800; margin-left:5px;}
  .glyph.g{color:#16a34a;} .glyph.f{color:#c4c8c4;} .glyph.b{color:#e0553f;}
  .status{font-weight:800;}
  .st-good{color:#16a34a;} .st-bad{color:#e0553f;} .st-flat{color:#8a8f8a;}
</style></head>

    <div class="tagline">Your week · Hung's report</div>
    <div class="metric"><span class="n" id="num">230</span> <span class="goal" id="goal">min / 180 goal</span></div>
  </div>
  <div class="bottom" id="bottom">
    <div class="bars" id="bars"></div>
    <div class="xlabels" id="labels"></div>
    <div class="charttitle">Rolling 7-day total</div>
    <div class="evals">
      <div class="evals-title">Treadmill evals · 15% incline / 30 min</div>
      <table class="eval-table">
        <thead><tr><th>Date</th><th>Efficiency</th><th>Work</th><th class="r">Status</th></tr></thead>
        <tbody id="evallist"></tbody>
      </table>
    </div>
  </div>

<script>
const GOAL = 180;
// Data: date + trailing-7-day total minutes. Update these to keep the report fresh.
const dates   = ["10-26", "10-27", "10-28", "10-29", "10-30", "10-31", "11-01", "11-02", "11-03", "11-04", "11-05", "11-06", "11-07", "11-08"];
const rolling = [0, 0, 0, 30, 60, 60, 110, 163, 187, 222, 230, 200, 254, 204];

const last = rolling[rolling.length-1];
const met  = last >= GOAL;

// background: green = goal hit, red = goal missed
document.body.style.background = met ? "#1aa263" : "#e0553f";
document.getElementById('num').textContent = last;
document.getElementById('goal').textContent = "min / " + GOAL + " goal";

const maxRoll = Math.max(...rolling, GOAL) * 1.1;
const bars = document.getElementById('bars');
bars.innerHTML = rolling.map(v => {
  const h = Math.max(Math.round(v/maxRoll*100), 4);
  return `<div class="bar ${v>=GOAL?'ok':'no'}" style="height:${h}%"></div>`;
}).join('');
const gl = document.createElement('div'); gl.className = 'goal-line';
// Position the goal line where a bar of height == GOAL would reach. Bars are
// bottom-aligned with height = % of the CONTENT box; an absolutely positioned
// element's % is relative to the PADDING box, so a naive `top: %` lands ~padding
// too high. Measure the real boxes and convert to px to keep them aligned.
const barH    = bars.clientHeight;                        // padding box height
const padTop  = parseFloat(getComputedStyle(bars).paddingTop) || 0;
const contentH = barH - padTop;                           // content box height
const goalTopPx = padTop + (1 - GOAL/maxRoll) * contentH;
gl.style.top = goalTopPx + 'px';
bars.appendChild(gl);
document.getElementById('labels').innerHTML = dates.map(d => `<span>${d}</span>`).join('');

// === Feature 1: bar tap → tooltip with that date's trailing-7-day total ===
// Each bar gets an inline tooltip showing ONLY the number (e.g. "200"). Tapping a
// bar toggles its tooltip; tapping elsewhere clears.
const barsEl = document.getElementById('bars');
barsEl.querySelectorAll('.bar').forEach((el, i) => {
  const tip = document.createElement('div'); tip.className = 'tooltip';
  tip.textContent = String(rolling[i]);          // just the number
  el.appendChild(tip);
  el.style.cursor = 'pointer';
  el.addEventListener('click', e => {
    e.stopPropagation();
    const was = el.classList.contains('tapped');
    barsEl.querySelectorAll('.bar.tapped').forEach(b => b.classList.remove('tapped'));
    if (!was) el.classList.add('tapped');
  });
});
document.addEventListener('click', e => {
  if (!e.target.classList || !e.target.classList.contains('bar'))
    barsEl.querySelectorAll('.bar.tapped').forEach(b => b.classList.remove('tapped'));
});

// === Feature 2: eval tracker (15% / 30 min treadmill evals) ===
// date | avg HR (bpm) | speed (km/h) — newest first. Log the 30-min-window avg
// HR when a session was longer than 30 min; longer sessions without a valid
// 30-min-window HR are excluded (eligibility rule).
const EVALS = [
  { d: "30.10", hr: 138, kmh: 3.3 },
  { d: "29.10", hr: 136, kmh: 3.3 },
  { d: "18.08", hr: 112, kmh: 3.0 },
  { d: "10.08", hr: 106, kmh: 2.5 },
  { d: "05.08", hr: 113, kmh: 2.4 },
];
(function renderEvals(){
  const list = document.getElementById('evallist');
  if (!EVALS.length) { list.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#a5aba5;padding:10px;">No evals yet</td></tr>'; return; }
  // Glyphs coloured by TRUE good/bad (per axis, inline below): Efficiency good
  // when HR goes down; Work good when speed goes up.
  const rows = EVALS.map((e, i) => {
    const prev = EVALS[i+1];
    const isFirst = prev === undefined;
    const hrDir = isFirst ? 0 : Math.sign(e.hr - prev.hr);   // + up, - down
    const spDir = isFirst ? 0 : Math.sign(e.kmh - prev.kmh);
    // Eff glyph: good when hr DOWN. Work glyph: good when speed UP.
    const hrGlyph = isFirst ? '<span class="glyph f">—</span>'
                : (hrDir < 0 ? '<span class="glyph g">✓</span>' : (hrDir > 0 ? '<span class="glyph b">✗</span>' : '<span class="glyph f">→</span>'));
    const spGlyph = isFirst ? '<span class="glyph f">—</span>'
                : (spDir > 0 ? '<span class="glyph g">✓</span>' : (spDir < 0 ? '<span class="glyph b">✗</span>' : '<span class="glyph f">→</span>'));
    // Verdict: overall improvement / regression
    let st, stcls;
    if (isFirst) { st = 'start'; stcls = 'st-flat'; }
    else if (spDir > 0 || (spDir === 0 && hrDir < 0)) { st = 'Improved'; stcls = 'st-good'; }
    else if (spDir === 0 && hrDir > 0) { st = 'Regression'; stcls = 'st-bad'; }
    else if (spDir < 0) { st = 'Regression'; stcls = 'st-bad'; }
    else { st = 'Steady'; stcls = 'st-flat'; }
    return `<tr>
      <td><span class="date">${e.d}</span></td>
      <td>${e.hr} ${hrGlyph}</td>
      <td>${e.kmh} ${spGlyph}</td>
      <td class="r"><span class="status ${stcls}">${st}</span></td>
    </tr>`;
  }).join('');
  list.innerHTML = rows;
})();
// === Header collapse on scroll (Slim): single line avatar-left / goal-right ===
(function(){
  const bottom = document.getElementById('bottom');
  const upd = () => { if (bottom.scrollTop > 6) document.body.setAttribute('scrolled',''); else document.body.removeAttribute('scrolled'); };
  bottom.addEventListener('scroll', upd);
  upd();
})();
</script>
